<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Beneficiaries - SmartBank</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div id="navbarContainer"></div>

    <main class="py-4">
        <div class="container">
            <div class="d-flex flex-column flex-md-row justify-content-between align-items-md-center mb-4 gap-3">
                <div>
                    <h3 class="fw-bold mb-1"><i class="bi bi-person-lines-fill text-primary me-2"></i>Beneficiary Management</h3>
                    <p class="text-muted small mb-0">Save and manage recipient accounts for quick and error-free fund transfers</p>
                </div>
                <button class="btn btn-primary shadow-sm" data-bs-toggle="modal" data-bs-target="#addBeneficiaryModal">
                    <i class="bi bi-person-plus me-1"></i> Add Beneficiary
                </button>
            </div>

            <!-- Beneficiaries Table Card -->
            <div class="card card-custom p-4">
                <div class="table-responsive">
                    <table class="table table-custom table-hover align-middle mb-0">
                        <thead class="table-light">
                            <tr>
                                <th>#</th>
                                <th>Beneficiary Name</th>
                                <th>Account Number</th>
                                <th>Bank Name</th>
                                <th class="text-end">Actions</th>
                            </tr>
                        </thead>
                        <tbody id="beneficiariesBody">
                            <tr>
                                <td colspan="5" class="text-center py-4 text-muted">
                                    <div class="spinner-border spinner-border-sm text-primary me-2"></div> Loading beneficiaries...
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>

        </div>
    </main>

    <!-- Add Beneficiary Modal -->
    <div class="modal fade" id="addBeneficiaryModal" tabindex="-1" aria-labelledby="addBeneficiaryModalLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title fw-bold" id="addBeneficiaryModalLabel"><i class="bi bi-person-plus text-primary me-2"></i>Add New Beneficiary</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <form id="addBeneficiaryForm">
                    <div class="modal-body">
                        <div class="mb-3">
                            <label for="benName" class="form-label fw-semibold">Beneficiary Name</label>
                            <input type="text" class="form-control" id="benName" placeholder="e.g. Priya Sharma" required>
                        </div>
                        <div class="mb-3">
                            <label for="benAccount" class="form-label fw-semibold">Account Number</label>
                            <input type="text" class="form-control" id="benAccount" placeholder="e.g. 1000987654" required>
                        </div>
                        <div class="mb-3">
                            <label for="benBank" class="form-label fw-semibold">Bank Name</label>
                            <input type="text" class="form-control" id="benBank" placeholder="e.g. Smart Bank / SBI / HDFC" value="Smart Bank">
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                        <button type="submit" class="btn btn-primary" id="saveBenBtn">
                            <span class="spinner-border spinner-border-sm me-1 d-none" id="saveBenSpinner"></span>
                            Save Beneficiary
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <div id="footerContainer"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/app.js"></script>
    <script>
        async function loadBeneficiaries() {
            requireAuth();
            const tbody = document.getElementById('beneficiariesBody');
            tbody.innerHTML = skeletonRows(5, 3);

            try {
                const res = await authFetch('/api/beneficiaries/my');
                const list = await res.json();

                if (!list || list.length === 0) {
                    tbody.innerHTML = `
                        <tr>
                            <td colspan="5" class="text-center py-5 text-muted">
                                <i class="bi bi-person-x fs-1 text-muted"></i>
                                <h6 class="fw-bold mt-2">No Beneficiaries Added Yet</h6>
                                <p class="small text-muted mb-3">Add frequently used accounts for one-click money transfers.</p>
                                <button class="btn btn-primary btn-sm" data-bs-toggle="modal" data-bs-target="#addBeneficiaryModal">Add Beneficiary</button>
                            </td>
                        </tr>
                    `;
                    return;
                }

                tbody.innerHTML = list.map((b, idx) => `
                    <tr>
                        <td class="text-muted small">${idx + 1}</td>
                        <td class="fw-semibold">
                            <i class="bi bi-person-circle text-primary me-2"></i> ${b.name}
                        </td>
                        <td class="font-monospace">${b.accountNumber}</td>
                        <td><span class="badge bg-light text-dark border">${b.bankName || 'Smart Bank'}</span></td>
                        <td class="text-end">
                            <a href="transfer.html?to=${b.accountNumber}" class="btn btn-sm btn-outline-primary me-1" title="Transfer Money">
                                <i class="bi bi-send me-1"></i> Send Money
                            </a>
                            <button class="btn btn-sm btn-outline-danger" onclick="deleteBeneficiary(${b.id}, '${b.name}')" title="Delete Beneficiary">
                                <i class="bi bi-trash"></i>
                            </button>
                        </td>
                    </tr>
                `).join('');
            } catch (err) {
                showAlert(err.message, 'danger');
                tbody.innerHTML = `<tr><td colspan="5" class="text-center text-danger py-4">Failed to load beneficiaries</td></tr>`;
            }
        }

        async function deleteBeneficiary(id, name) {
            if (!confirm(`Are you sure you want to remove beneficiary "${name}"?`)) {
                return;
            }

            try {
                const res = await authFetch(`/api/beneficiaries/${id}`, {
                    method: 'DELETE'
                });

                if (!res.ok) {
                    const err = await res.json().catch(() => ({ message: 'Failed to delete' }));
                    throw new Error(err.message);
                }

                showAlert(`Beneficiary "${name}" removed successfully`, 'success');
                loadBeneficiaries();
            } catch (err) {
                showAlert(err.message, 'danger');
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            renderNavbar('beneficiaries');
            loadBeneficiaries();

            const form = document.getElementById('addBeneficiaryForm');
            form.addEventListener('submit', async (e) => {
                e.preventDefault();
                const name = document.getElementById('benName').value.trim();
                const accountNumber = document.getElementById('benAccount').value.trim();
                const bankName = document.getElementById('benBank').value.trim() || 'Smart Bank';

                const btn = document.getElementById('saveBenBtn');
                const spinner = document.getElementById('saveBenSpinner');
                btn.disabled = true;
                spinner.classList.remove('d-none');

                try {
                    const res = await authFetch('/api/beneficiaries', {
                        method: 'POST',
                        body: JSON.stringify({ name, accountNumber, bankName })
                    });

                    const data = await res.json();
                    if (!res.ok) throw new Error(data.message || 'Failed to add beneficiary');

                    showAlert(`Beneficiary "${name}" added successfully!`, 'success');
                    const modal = bootstrap.Modal.getInstance(document.getElementById('addBeneficiaryModal'));
                    modal.hide();
                    form.reset();
                    loadBeneficiaries();
                } catch (err) {
                    showAlert(err.message, 'danger');
                } finally {
                    btn.disabled = false;
                    spinner.classList.add('d-none');
                }
            });
        });
    </script>
</body>
</html>
