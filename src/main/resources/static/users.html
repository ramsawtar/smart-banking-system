<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Directory - SmartBank Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div id="navbarContainer"></div>

    <main class="py-4">
        <div class="container">
            <!-- Header -->
            <div class="d-flex flex-column flex-md-row justify-content-between align-items-md-center mb-4 gap-3">
                <div>
                    <div class="badge bg-danger px-3 py-1 mb-2">ADMINISTRATOR ACCESS</div>
                    <h3 class="fw-bold mb-0"><i class="bi bi-people text-primary me-2"></i>Customer Directory</h3>
                    <p class="text-muted small mb-0">Inspect registered customers, contact information, and role assignments</p>
                </div>
                <div class="d-flex gap-2">
                    <a href="admin-dashboard.html" class="btn btn-outline-secondary btn-sm">
                        <i class="bi bi-arrow-left me-1"></i> Return to Admin Dashboard
                    </a>
                    <button class="btn btn-outline-primary btn-sm" onclick="loadCustomers()">
                        <i class="bi bi-arrow-clockwise me-1"></i> Refresh
                    </button>
                </div>
            </div>

            <!-- Customer Search & Filter Card -->
            <div class="card card-custom p-3 mb-4">
                <div class="row g-3 align-items-center">
                    <div class="col-md-6">
                        <div class="input-group">
                            <span class="input-group-text bg-light"><i class="bi bi-search"></i></span>
                            <input type="text" class="form-control" id="searchUserInput" placeholder="Search by name, email, or phone...">
                        </div>
                    </div>
                    <div class="col-md-6 text-md-end text-muted small">
                        Showing <span class="fw-bold text-dark" id="customerCountDisplay">0</span> registered customer records
                    </div>
                </div>
            </div>

            <!-- Customers Table -->
            <div class="card card-custom p-4">
                <div class="table-responsive">
                    <table class="table table-custom table-hover align-middle mb-0">
                        <thead class="table-light">
                            <tr>
                                <th>#</th>
                                <th>Customer Name</th>
                                <th>Email Address</th>
                                <th>Phone Number</th>
                                <th>Role</th>
                                <th>Account Status</th>
                            </tr>
                        </thead>
                        <tbody id="customersBody">
                            <tr>
                                <td colspan="6" class="text-center py-4 text-muted">
                                    <div class="spinner-border spinner-border-sm text-primary me-2"></div> Loading customer directory...
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>

        </div>
    </main>

    <div id="footerContainer"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/app.js"></script>
    <script>
        let allCustomers = [];

        async function loadCustomers() {
            requireAdmin();
            renderNavbar('users');
            document.getElementById('customersBody').innerHTML = skeletonRows(6, 4);

            try {
                const res = await authFetch('/api/admin/customers');
                allCustomers = await res.json();
                renderCustomersTable();
            } catch (err) {
                showAlert(err.message, 'danger');
                document.getElementById('customersBody').innerHTML = `
                    <tr><td colspan="6" class="text-center text-danger py-4">Failed to load customers: ${err.message}</td></tr>
                `;
            }
        }

        function renderCustomersTable() {
            const tbody = document.getElementById('customersBody');
            const searchVal = document.getElementById('searchUserInput').value.trim().toLowerCase();

            const filtered = allCustomers.filter(c => {
                const name = (c.name || '').toLowerCase();
                const email = (c.email || '').toLowerCase();
                const phone = (c.phone || '').toLowerCase();
                return name.includes(searchVal) || email.includes(searchVal) || phone.includes(searchVal);
            });

            document.getElementById('customerCountDisplay').innerText = filtered.length;

            if (!filtered || filtered.length === 0) {
                tbody.innerHTML = `<tr><td colspan="6" class="text-center py-4 text-muted">No customers match query.</td></tr>`;
                return;
            }

            tbody.innerHTML = filtered.map((c, idx) => `
                <tr>
                    <td class="text-muted small">${c.id || (idx + 1)}</td>
                    <td class="fw-semibold">
                        <i class="bi bi-person-circle text-primary me-2"></i> ${c.name}
                    </td>
                    <td><a href="mailto:${c.email}" class="text-decoration-none">${c.email}</a></td>
                    <td class="font-monospace">${c.phone}</td>
                    <td><span class="badge bg-light text-dark border">${c.role}</span></td>
                    <td>${statusBadge(c.status)}</td>
                </tr>
            `).join('');
        }

        document.addEventListener('DOMContentLoaded', () => {
            loadCustomers();
            document.getElementById('searchUserInput').addEventListener('input', renderCustomersTable);
        });
    </script>
</body>
</html>
