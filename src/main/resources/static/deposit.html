<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Deposit Funds - SmartBank</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div id="navbarContainer"></div>

    <main class="py-5">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-md-7 col-lg-6">
                    <div class="card card-custom p-4 p-md-5">
                        <div class="text-center mb-4">
                            <div class="bg-success bg-opacity-10 text-success d-inline-flex p-3 rounded-circle mb-3">
                                <i class="bi bi-arrow-down-circle fs-1"></i>
                            </div>
                            <h3 class="fw-bold">Deposit Funds</h3>
                            <p class="text-muted small">Credit funds securely into your bank account</p>
                        </div>

                        <form id="depositForm">
                            <div class="mb-3">
                                <label for="depositAccountSelect" class="form-label fw-semibold">Target Account</label>
                                <select class="form-select" id="depositAccountSelect" required>
                                    <option value="">Loading accounts...</option>
                                </select>
                            </div>

                            <div class="p-3 bg-light rounded-3 mb-3 border">
                                <div class="d-flex justify-content-between text-muted small">
                                    <span>Current Balance</span>
                                    <span>Projected New Balance</span>
                                </div>
                                <div class="d-flex justify-content-between fw-bold fs-5 mt-1">
                                    <span class="text-dark" id="currentBalText">₹0.00</span>
                                    <span class="text-success" id="newBalText">₹0.00</span>
                                </div>
                            </div>

                            <div class="mb-3">
                                <label for="amount" class="form-label fw-semibold">Deposit Amount (₹)</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-light">₹</span>
                                    <input type="number" class="form-control form-control-lg" id="amount" min="1" step="0.01" placeholder="5000.00" required>
                                </div>
                            </div>

                            <div class="mb-4">
                                <label for="description" class="form-label fw-semibold">Description / Remarks</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-light"><i class="bi bi-pencil"></i></span>
                                    <input type="text" class="form-control" id="description" placeholder="Salary, Cash Deposit, etc." value="Cash Deposit">
                                </div>
                            </div>

                            <button type="submit" class="btn btn-success w-100 py-3 fw-semibold shadow-sm" id="depositBtn">
                                <span class="spinner-border spinner-border-sm me-2 d-none" id="depositSpinner"></span>
                                <i class="bi bi-check2-circle me-1"></i> Confirm & Deposit
                            </button>
                        </form>

                        <div class="text-center mt-4">
                            <a href="dashboard.html" class="small text-muted text-decoration-none">
                                <i class="bi bi-arrow-left me-1"></i> Return to Dashboard
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <div id="footerContainer"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/app.js"></script>
    <script>
        let accounts = [];

        function updateProjectedBalance() {
            const accSelect = document.getElementById('depositAccountSelect');
            const acc = accounts.find(a => a.id == accSelect.value);
            const amountInput = parseFloat(document.getElementById('amount').value || '0');

            if (acc) {
                const currentBal = Number(acc.balance);
                document.getElementById('currentBalText').innerText = formatCurrency(currentBal);
                const projected = currentBal + (amountInput > 0 ? amountInput : 0);
                document.getElementById('newBalText').innerText = formatCurrency(projected);
            }
        }

        async function initDepositPage() {
            requireAuth();
            renderNavbar('deposit');

            try {
                const res = await authFetch('/api/accounts/my');
                accounts = await res.json();

                const select = document.getElementById('depositAccountSelect');
                select.innerHTML = '';

                if (!accounts || accounts.length === 0) {
                    select.innerHTML = '<option value="">No accounts found</option>';
                    document.getElementById('depositBtn').disabled = true;
                    return;
                }

                accounts.forEach(acc => {
                    const opt = document.createElement('option');
                    opt.value = acc.id;
                    opt.textContent = `${acc.accountType} - ${acc.accountNumber} (${formatCurrency(acc.balance)})`;
                    select.appendChild(opt);
                });

                const urlParams = new URLSearchParams(window.location.search);
                const queryAccId = urlParams.get('accountId') || localStorage.getItem('smart_bank_active_account');
                if (queryAccId && accounts.some(a => a.id == queryAccId)) {
                    select.value = queryAccId;
                } else {
                    select.value = accounts[0].id;
                }

                select.addEventListener('change', updateProjectedBalance);
                document.getElementById('amount').addEventListener('input', updateProjectedBalance);
                updateProjectedBalance();
            } catch (err) {
                showAlert(err.message, 'danger');
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            initDepositPage();

            const form = document.getElementById('depositForm');
            form.addEventListener('submit', async (e) => {
                e.preventDefault();
                const accountId = document.getElementById('depositAccountSelect').value;
                const amount = parseFloat(document.getElementById('amount').value);
                const description = document.getElementById('description').value.trim() || 'Cash Deposit';

                const btn = document.getElementById('depositBtn');
                const spinner = document.getElementById('depositSpinner');
                btn.disabled = true;
                spinner.classList.remove('d-none');

                try {
                    const res = await authFetch(`/api/accounts/${accountId}/deposit`, {
                        method: 'POST',
                        body: JSON.stringify({ amount, description })
                    });

                    const data = await res.json();
                    if (!res.ok) throw new Error(data.message || 'Deposit failed');

                    showAlert(`₹${amount.toFixed(2)} deposited successfully! New balance: ${formatCurrency(data.balance)}`, 'success');
                    setTimeout(() => {
                        window.location.href = 'dashboard.html';
                    }, 1000);
                } catch (err) {
                    showAlert(err.message, 'danger');
                    btn.disabled = false;
                    spinner.classList.add('d-none');
                }
            });
        });
    </script>
</body>
</html>
