<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile Settings - SmartBank</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div id="navbarContainer"></div>

    <main class="py-5">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-lg-8">
                    <!-- Profile Card -->
                    <div class="card card-custom p-4 p-md-5 mb-4">
                        <div class="d-flex align-items-center mb-4">
                            <div class="bg-primary text-white d-flex align-items-center justify-content-center rounded-circle fs-2 me-3" style="width: 64px; height: 64px;">
                                <i class="bi bi-person"></i>
                            </div>
                            <div>
                                <h3 class="fw-bold mb-0" id="profileNameDisplay">User Name</h3>
                                <p class="text-muted small mb-0" id="profileEmailDisplay">user@example.com</p>
                                <span class="badge bg-primary mt-1" id="profileRoleBadge">CUSTOMER</span>
                                <span class="badge bg-success mt-1" id="profileStatusBadge">ACTIVE</span>
                            </div>
                        </div>

                        <hr>

                        <!-- Edit Profile Form -->
                        <h5 class="fw-bold mb-3"><i class="bi bi-pencil-square text-primary me-2"></i>Update Personal Details</h5>
                        <form id="updateProfileForm" class="mb-4">
                            <div class="row g-3">
                                <div class="col-md-6">
                                    <label for="editName" class="form-label fw-semibold">Full Name</label>
                                    <input type="text" class="form-control" id="editName" required>
                                </div>
                                <div class="col-md-6">
                                    <label for="editPhone" class="form-label fw-semibold">Phone Number</label>
                                    <input type="tel" class="form-control" id="editPhone" pattern="[0-9]{10}" required>
                                </div>
                            </div>
                            <div class="mt-3">
                                <button type="submit" class="btn btn-primary btn-sm px-4" id="saveProfileBtn">
                                    <span class="spinner-border spinner-border-sm me-1 d-none" id="saveProfileSpinner"></span>
                                    Save Changes
                                </button>
                            </div>
                        </form>

                        <hr>

                        <!-- Change Password Form -->
                        <h5 class="fw-bold mb-3"><i class="bi bi-shield-lock text-primary me-2"></i>Change Password</h5>
                        <form id="changePasswordForm">
                            <div class="row g-3">
                                <div class="col-md-4">
                                    <label for="currentPassword" class="form-label fw-semibold">Current Password</label>
                                    <input type="password" class="form-control" id="currentPassword" required>
                                </div>
                                <div class="col-md-4">
                                    <label for="newPassword" class="form-label fw-semibold">New Password</label>
                                    <input type="password" class="form-control" id="newPassword" minlength="4" required>
                                </div>
                                <div class="col-md-4">
                                    <label for="confirmNewPassword" class="form-label fw-semibold">Confirm Password</label>
                                    <input type="password" class="form-control" id="confirmNewPassword" minlength="4" required>
                                </div>
                            </div>
                            <div class="mt-3">
                                <button type="submit" class="btn btn-outline-danger btn-sm px-4" id="changePasswordBtn">
                                    <span class="spinner-border spinner-border-sm me-1 d-none" id="changePassSpinner"></span>
                                    Update Password
                                </button>
                            </div>
                        </form>
                    </div>

                    <div class="text-center">
                        <button class="btn btn-outline-secondary btn-sm" onclick="logout()">
                            <i class="bi bi-box-arrow-right me-1"></i> Sign Out of Account
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <div id="footerContainer"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/app.js"></script>
    <script>
        async function loadProfile() {
            requireAuth();
            renderNavbar('profile');

            try {
                const res = await authFetch('/api/users/me');
                const user = await res.json();

                document.getElementById('profileNameDisplay').innerText = user.name;
                document.getElementById('profileEmailDisplay').innerText = user.email;
                document.getElementById('profileRoleBadge').innerText = user.role;
                document.getElementById('profileStatusBadge').innerText = user.status;

                document.getElementById('editName').value = user.name;
                document.getElementById('editPhone').value = user.phone;
            } catch (err) {
                showAlert(err.message, 'danger');
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            loadProfile();

            // Update profile
            const profileForm = document.getElementById('updateProfileForm');
            profileForm.addEventListener('submit', async (e) => {
                e.preventDefault();
                const name = document.getElementById('editName').value.trim();
                const phone = document.getElementById('editPhone').value.trim();

                const btn = document.getElementById('saveProfileBtn');
                const spinner = document.getElementById('saveProfileSpinner');
                btn.disabled = true;
                spinner.classList.remove('d-none');

                try {
                    const res = await authFetch('/api/users/me', {
                        method: 'PUT',
                        body: JSON.stringify({ name, phone })
                    });
                    const data = await res.json();
                    if (!res.ok) throw new Error(data.message || 'Update failed');

                    // Update cached user in localStorage
                    const cur = getUser();
                    if (cur) {
                        cur.name = data.name;
                        localStorage.setItem('smart_bank_user', JSON.stringify(cur));
                    }

                    showAlert('Profile updated successfully!', 'success');
                    loadProfile();
                } catch (err) {
                    showAlert(err.message, 'danger');
                } finally {
                    btn.disabled = false;
                    spinner.classList.add('d-none');
                }
            });

            // Change password
            const passForm = document.getElementById('changePasswordForm');
            passForm.addEventListener('submit', async (e) => {
                e.preventDefault();
                const currentPassword = document.getElementById('currentPassword').value;
                const newPassword = document.getElementById('newPassword').value;
                const confirmNewPassword = document.getElementById('confirmNewPassword').value;

                if (newPassword !== confirmNewPassword) {
                    showAlert('New passwords do not match!', 'danger');
                    return;
                }

                const btn = document.getElementById('changePasswordBtn');
                const spinner = document.getElementById('changePassSpinner');
                btn.disabled = true;
                spinner.classList.remove('d-none');

                try {
                    const res = await authFetch('/api/users/change-password', {
                        method: 'PUT',
                        body: JSON.stringify({ currentPassword, newPassword })
                    });

                    if (!res.ok) {
                        const err = await res.json().catch(() => ({ message: 'Password update failed' }));
                        throw new Error(err.message);
                    }

                    showAlert('Password changed successfully!', 'success');
                    passForm.reset();
                } catch (err) {
                    showAlert(err.message, 'danger');
                } finally {
                    btn.disabled = false;
                    spinner.classList.add('d-none');
                }
            });
        });
    </script>
</body>
</html>
