<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - SmartBank</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div id="navbarContainer"></div>

    <main class="py-5">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-md-6 col-lg-5">
                    <div class="card card-custom p-4 p-md-5">
                        <div class="text-center mb-4">
                            <div class="bg-primary bg-opacity-10 text-primary d-inline-flex p-3 rounded-circle mb-3">
                                <i class="bi bi-shield-lock fs-1"></i>
                            </div>
                            <h3 class="fw-bold">Sign In to SmartBank</h3>
                            <p class="text-muted small">Enter your credentials to access your account</p>
                        </div>

                        <form id="loginForm">
                            <div class="mb-3">
                                <label for="email" class="form-label fw-semibold">Email Address</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-light"><i class="bi bi-envelope"></i></span>
                                    <input type="email" class="form-control" id="email" placeholder="name@example.com" required>
                                </div>
                            </div>
                            <div class="mb-4">
                                <label for="password" class="form-label fw-semibold">Password</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-light"><i class="bi bi-key"></i></span>
                                    <input type="password" class="form-control" id="password" placeholder="Enter password" required>
                                </div>
                            </div>
                            <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold shadow-sm" id="loginBtn">
                                <span class="spinner-border spinner-border-sm me-2 d-none" id="loginSpinner"></span>
                                <i class="bi bi-box-arrow-in-right me-1"></i> Sign In
                            </button>
                        </form>

                        <div class="text-center mt-4">
                            <p class="small text-muted mb-0">Don't have an account? <a href="register.html" class="fw-semibold text-primary">Register Here</a></p>
                        </div>

                        <hr class="my-4">

                        <!-- Quick Demo Fill Buttons -->
                        <div>
                            <small class="text-muted fw-bold d-block mb-2 text-uppercase text-center">Quick Demo Login</small>
                            <div class="d-grid gap-2">
                                <button type="button" class="btn btn-outline-primary btn-sm text-start" onclick="fillDemo('ram@smartbank.com', 'ram123')">
                                    <i class="bi bi-person me-2"></i> Demo Customer: <strong>Ram</strong> (ram@smartbank.com)
                                </button>
                                <button type="button" class="btn btn-outline-secondary btn-sm text-start" onclick="fillDemo('priya@smartbank.com', 'priya123')">
                                    <i class="bi bi-person me-2"></i> Demo Customer: <strong>Priya</strong> (priya@smartbank.com)
                                </button>
                                <button type="button" class="btn btn-outline-danger btn-sm text-start" onclick="fillDemo('admin@smartbank.com', 'admin123')">
                                    <i class="bi bi-shield-shaded me-2"></i> Demo Admin: <strong>Admin</strong> (admin@smartbank.com)
                                </button>
                            </div>
                        </div>

                    </div>
                </div>
            </div>
        </div>
    </main>

    <div id="footerContainer"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/app.js"></script>
    <script>
        function fillDemo(email, pass) {
            document.getElementById('email').value = email;
            document.getElementById('password').value = pass;
        }

        document.addEventListener('DOMContentLoaded', () => {
            renderNavbar('login');
            // If already logged in, redirect
            if (isAuthenticated()) {
                window.location.href = isAdmin() ? 'admin-dashboard.html' : 'dashboard.html';
                return;
            }

            const urlParams = new URLSearchParams(window.location.search);
            if (urlParams.get('role') === 'admin') {
                fillDemo('admin@smartbank.com', 'admin123');
            }

            const form = document.getElementById('loginForm');
            form.addEventListener('submit', async (e) => {
                e.preventDefault();
                const email = document.getElementById('email').value.trim();
                const password = document.getElementById('password').value;
                const loginBtn = document.getElementById('loginBtn');
                const spinner = document.getElementById('loginSpinner');

                loginBtn.disabled = true;
                spinner.classList.remove('d-none');

                try {
                    const res = await fetch('/api/auth/login', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ email, password })
                    });

                    const data = await res.json();
                    if (!res.ok) {
                        throw new Error(data.message || 'Login failed');
                    }

                    setAuth(data);
                    showAlert('Login successful! Redirecting...', 'success');

                    setTimeout(() => {
                        if (data.role === 'ADMIN') {
                            window.location.href = 'admin-dashboard.html';
                        } else {
                            window.location.href = 'dashboard.html';
                        }
                    }, 600);
                } catch (err) {
                    showAlert(err.message, 'danger');
                    loginBtn.disabled = false;
                    spinner.classList.add('d-none');
                }
            });
        });
    </script>
</body>
</html>
